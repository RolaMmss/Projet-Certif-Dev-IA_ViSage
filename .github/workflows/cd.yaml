# .github/workflows/deployment.yml

name: Deployment

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up .env file
        run: |
          echo "DOCKERHUB_USERNAME=${{ secrets.DOCKERHUB_USERNAME }}" >> .env
          echo "DOCKERHUB_PASSWORD=${{ secrets.DOCKERHUB_PASSWORD }}" >> .env
          echo "SUBSCRIPTION_ID=${{ secrets.SUBSCRIPTION_ID }}" >> .env
          echo "RESSOURCE_GROUP=${{ secrets.RESOURCE_GROUP }}" >> .env

      - name: Login to Azure CLI
        uses: azure/login@v1
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container Instances (ACI)
        run: |
          chmod +x scripts/create_ACI.sh
          ./scripts/create_ACI.sh
