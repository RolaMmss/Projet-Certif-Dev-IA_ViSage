name: CI Pipeline

on:
  push:
    paths:
      - 'myproject/**'
      - '.github/workflows/webapp_continuous_integration.yaml'

  pull_request:
    types: [opened, synchronize, reopened]
    # branches:
    #   - main
    #   - develop
    paths:
      - 'myproject/**'
      - '.github/workflows/webapp_continuous_integration.yaml'
  workflow_call:  # Make the workflow reusable
jobs:
  build:
    runs-on: ubuntu-latest

    env:
          DJANGO_SETTINGS_MODULE: myproject.settings

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Cache dependency
        uses: actions/cache@v2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          python -m venv myenv
          source myenv/bin/activate
          pip install -r myproject/requirements.txt

      - name: Set DJANGO_SETTINGS_MODULE
        run: echo "DJANGO_SETTINGS_MODULE=myproject.settings" >> $GITHUB_ENV

      - name: Set environment variable
        env:
          APPLICATIONINSIGHTS_CONNECTION_STRING: ${{ secrets.APPLICATIONINSIGHTS_CONNECTION_STRING }}
        run: |
          source myenv/bin/activate
          python myproject/manage.py test 
