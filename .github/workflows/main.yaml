# .github/workflows/main.yml

name: CI/CD Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v1

      - name: Login to DockerHub
        run: echo ${{ secrets.DOCKERHUB_TOKEN }} | docker login -u ${{ secrets.DOCKERHUB_USERNAME }} --password-stdin

      - name: Build and push Docker image
        run: |
          docker buildx build --platform linux/amd64 -t ${{ secrets.DOCKERHUB_USERNAME }}/repo_docker:latest . --push

      - name: Deploy to Azure Container Instances (ACI)
        env:
          RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}
          ACI_NAME: myapp-container
          CONTAINER_IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/myapp:latest
          SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          az container create \
            --resource-group $RESOURCE_GROUP \
            --name $ACI_NAME \
            --image $CONTAINER_IMAGE \
            --cpu 1 \
            --memory 1.5 \
            --port 8000 \
            --environment-variables \
              DJANGO_SETTINGS_MODULE=myapp.settings.production \
              SECRET_KEY=${{ secrets.DJANGO_SECRET_KEY }} \
            --dns-name-label $ACI_NAME \
            --os-type Linux \
            --restart-policy OnFailure \
            --output json

          # Optional: Retrieve and print ACI FQDN or other info
          az container show --resource-group $RESOURCE_GROUP --name $ACI_NAME --query "{FQDN: ipAddress.fqdn}" --output table
