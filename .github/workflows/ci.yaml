name: CI Pipeline

on:
  push:
    branches:
      - develop
      - main
    paths:
      - 'myproject/**'  # Adjust the path based on your Django project structure
      - '.github/workflows/ci.yaml'
  pull_request:
    branches:
      - develop
      - main

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v2

      - name: Cache dependencies
        uses: actions/cache@v2
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Set up Python
        uses: actions/setup-python@v2
        with:
          python-version: '3.10'  # Adjust Python version as needed

      - name: Set up virtual environment and install dependencies
        run: |
          python -m venv myenv
          source myenv/bin/activate
          pip install --upgrade pip
          pip install -r myproject/requirements.txt

      - name: Set environment variables
        env:
          DJANGO_SETTINGS_MODULE: myproject.settings
        run: echo "Environment variables set"

      - name: Verify manage.py file
        run: ls myproject/manage.py  # Ensure manage.py file exists in the correct path

      - name: Run Django checks
        run: |
          source myenv/bin/activate
          python myproject/manage.py check

      - name: Run Django tests
        run: |
          source myenv/bin/activate
          python myproject/manage.py test myapp --settings=myproject.settings

      - name: Run pytest
        run: |
          source myenv/bin/activate
          pytest myproject/myapp/tests.py --disable-warnings




